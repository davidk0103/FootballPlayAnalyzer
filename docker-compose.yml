name: playbookiq

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-playbookiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-playbookiq}
      POSTGRES_DB: ${POSTGRES_DB:-playbookiq}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One Redis for two roles: Celery broker (db 0) and analytics cache (db 1).
  # volatile-lru only evicts keys that have a TTL (cache entries), never queued messages.
  # appendonly keeps queued messages across a Redis restart.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment: &backend-env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-playbookiq}:${POSTGRES_PASSWORD:-playbookiq}@db:5432/${POSTGRES_DB:-playbookiq}
      BROKER_URL: redis://redis:6379/0
      CACHE_URL: redis://redis:6379/1
      DATA_CACHE_DIR: /app/data/cache
      # Private uploads and report exports. Must be the same volume for API and workers.
      STORAGE_DIR: /app/data/storage
      CORS_ORIGINS: '["http://localhost:5317","http://127.0.0.1:5317"]'
    ports:
      - "8317:8317"
    volumes:
      - nflverse-cache:/app/data/cache
      - user-storage:/app/data/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Celery worker. Scale processes with `docker compose up -d --scale worker=4`;
  # each container runs WORKER_CONCURRENCY prefork pool processes (see docs/architecture.md).
  worker:
    build: ./backend
    command:
      - sh
      - -c
      - exec celery -A app.worker.celery_app worker --loglevel=INFO --pool=prefork --concurrency=$${WORKER_CONCURRENCY} -n worker@%h
    environment:
      <<: *backend-env
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      # Test-only hooks for practicing failure scenarios (docs/architecture.md). Off by default.
      ENABLE_FAULT_INJECTION: ${ENABLE_FAULT_INJECTION:-false}
    volumes:
      - nflverse-cache:/app/data/cache
      - user-storage:/app/data/storage
    # SIGTERM starts a warm shutdown: stop taking messages, let running imports finish.
    # Past this grace period Docker sends SIGKILL and crash recovery takes over.
    stop_signal: SIGTERM
    stop_grace_period: 120s
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping -d worker@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 15s
      start_period: 20s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Schedules the stale-job reaper. Run exactly one beat, regardless of worker count.
  beat:
    build: ./backend
    command: ["celery", "-A", "app.worker.celery_app", "beat", "--loglevel=INFO", "--schedule", "/tmp/celerybeat-schedule"]
    environment: *backend-env
    healthcheck:
      test: ["CMD-SHELL", "test -s /tmp/celerybeat-schedule"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8317
    ports:
      - "5317:5317"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      backend:
        condition: service_healthy

  # Disposable database for integration tests: `make test-db` / `make test`.
  db-test:
    image: postgres:16
    profiles: ["test"]
    environment:
      POSTGRES_USER: playbookiq
      POSTGRES_PASSWORD: playbookiq
      POSTGRES_DB: playbookiq_test
    ports:
      - "5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playbookiq -d playbookiq_test"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis-test:
    image: redis:7-alpine
    profiles: ["test"]
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  redisdata:
  nflverse-cache:
  user-storage:
